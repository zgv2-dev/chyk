[package]
name = "chyk"
version = "1.3.2"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = [".", "shell"]

[features]
# The portable Windows build: no setup, unpacks its libraries and keeps its data in `Chyk\` next to
# the exe (src/portable.rs). Without it, the Windows build is the installer (src/setup).
portable = []

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui-phosphor = "0.14"
libmpv2 = "6"
rfd = "0.17"
sys-locale = "0.3"

raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
flate2 = "1"
# Checking the libraries against the hashes build.rs pinned (src/bundle.rs).
sha2 = "0.10"
# Taskbar progress and the done sound (src/notify.rs), the Explorer menu entry (src/shell_menu),
# rounded window corners (src/chrome/windows.rs), raising the shared settings window (src/app/settings_share.rs), the export part's DACL
# (src/ffmpeg/part), setup and elevation (src/setup). Same version accesskit uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Launcher progress over D-Bus (src/notify.rs). Same version accesskit uses.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Wayland file drops, which winit 0.30 lacks (src/dnd). Same versions winit and smithay-clipboard use.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

# Copying a replaced file's POSIX ACL onto the export (src/ffmpeg/part.rs). Same version std uses.
# getuid for private temp folders (src/ffmpeg/scratch.rs), ACLs on Linux (src/ffmpeg/part/acl.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"
sha2 = "0.10"

# build.rs deflates ~300 MB on Windows; unoptimized miniz takes minutes.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

# Moving the native traffic lights into the header (src/chrome.rs), Dock progress (src/notify.rs). Same versions eframe uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "NSColorSpace", "NSApplication", "NSMenu", "NSMenuItem", "NSDockTile", "NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
