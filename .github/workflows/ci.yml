name: CI

# Every push and PR: build, test and package for macOS, Windows and Linux.
# Tags like v1.2.3: also publish the packages as a GitHub release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  macos:
    # Local equivalent: scripts/package-macos.sh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: brew install mpv dylibbundler
      - run: cargo test
      - run: scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    # Local equivalent: scripts/package-linux.sh.
    # mpv >= 0.35 (libmpv.so.2) is needed, so 24.04 is the oldest usable Ubuntu.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev ffmpeg libxkbcommon-dev libfuse2
      - run: cargo test
      # Tests already ran above.
      - run: SKIP_TESTS=1 scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    # Local equivalent: scripts/package-windows.ps1.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows packaging script
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/package-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv and ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*.7z' -O mpv.7z
          7z x mpv.7z -ompv | Out-Null
          # MSVC needs an import library; build mpv.lib from the DLL's exports.
          $exports = dumpbin /exports mpv/libmpv-2.dll | ForEach-Object { if ($_ -match '\s(mpv_\w+)$') { $Matches[1] } }
          Set-Content mpv/mpv.def (@('EXPORTS') + $exports)
          lib /nologo /def:mpv/mpv.def /name:libmpv-2.dll /out:mpv/mpv.lib /machine:x64
          gh release download latest -R BtbN/FFmpeg-Builds -p 'ffmpeg-master-latest-win64-gpl.zip' -O ffmpeg.zip
          7z x ffmpeg.zip | Out-Null
          "MPV_LIB_DIR=$PWD\mpv" >> $env:GITHUB_ENV
          "$PWD\mpv" >> $env:GITHUB_PATH
          "$PWD\ffmpeg-master-latest-win64-gpl\bin" >> $env:GITHUB_PATH
      - run: cargo test
      # build.rs embeds libmpv (MPV_LIB_DIR) and ffmpeg (PATH); src/bundle.rs unpacks them on first run.
      - run: cargo build --release
      - name: Package exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/glint.exe "dist/Glint-$env:VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
