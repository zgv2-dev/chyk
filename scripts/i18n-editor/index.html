<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glint · Translations</title>
<link rel="stylesheet" href="/assets/phosphor.css">
<link rel="stylesheet" href="/editor/style.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 24"><rect x="1" y="4" width="30" height="16" rx="4" fill="#4dff9b" stroke="none"/><rect x="6.5" y="6.5" width="19" height="11" rx="1" fill="#07130c" stroke="none"/><path d="M12.8 8v8M19.2 8v8" stroke="#4dff9b" stroke-opacity=".3" stroke-width="1"/><path d="M3.5 9v6M28.5 9v6" stroke="#00140a" stroke-width="1"/><path d="M14.1 1v22" stroke="#fff" stroke-width="1.5"/></svg>
  <span class="wordmark">G L I N T</span>
  <label class="search"><i class="ph ph-magnifying-glass"></i><input id="q" placeholder="Search keys and text" autocomplete="off"></label>
  <div class="seg" id="filter">
    <button data-f="all" class="on">All</button>
    <button data-f="issues">Needs attention</button>
  </div>
  <span class="count" id="count"></span>
  <div class="grow"></div>
  <span class="state" id="state">Saved</span>
  <button class="primary" id="save" disabled><i class="ph ph-floppy-disk"></i>Save</button>
</header>
<main>
  <section class="table" id="table">
    <div class="cols"><span>Key</span><span>English</span><span>Українська</span></div>
    <div id="rows"></div>
  </section>
  <section class="preview">
    <div class="ptools">
      <div class="seg" id="screens">
        <button data-s="start" class="on"><i class="ph ph-film-slate"></i>Start</button>
        <button data-s="editor"><i class="ph ph-crop"></i>Crop</button>
        <button data-s="strip"><i class="ph ph-magic-wand"></i>Strip</button>
        <button data-s="metadata"><i class="ph ph-info"></i>Info</button>
        <button data-s="export"><i class="ph ph-export"></i>Export</button>
      </div>
      <div class="seg" id="langs">
        <button data-l="en">EN</button>
        <button data-l="uk" class="on">UK</button>
      </div>
    </div>
    <div class="frame" id="frame"><iframe id="iframe" title="Preview"></iframe></div>
    <p class="hint">Click text in the preview to jump to its row. Strings are compiled into Glint, so rebuild the app after saving.</p>
  </section>
</main>
<script src="/editor/table.js"></script>
<script src="/editor/preview.js"></script>
</body>
</html>
