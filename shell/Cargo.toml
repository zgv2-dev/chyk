[package]
name = "chyk-shell"
version = "1.3.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Chyk's Windows 11 Explorer menu entry: an IExplorerCommand DLL and the sparse package's stub exe"

[lib]
name = "chyk_shell"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "chyk-shell"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62"
