<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chyk · Phosphor</title>
<style>
  body { margin: 0; background: #000; color: #cfeedd; font: 13px ui-monospace, Menlo, monospace; }
  nav span { display: flex; gap: 6px; margin-right: 18px; }
  nav { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; background: rgba(0,0,0,.88); }
  button { font: inherit; color: #5f8a71; background: #07130c; border: 1px solid #12301f; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button[aria-pressed="true"] { color: #4dff9b; border-color: #4dff9b; }
  main { display: grid; gap: 24px; padding: 8px 16px 32px; }
  figure { margin: 0 auto; max-width: 1280px; width: 100%; }
  figcaption { color: #5f8a71; margin: 0 0 8px 2px; }
  img { max-width: 100%; display: block; border-radius: 10px; box-shadow: 0 0 0 1px #12301f; }
</style></head>
<body>
<nav>
  <span id="langs"><button data-l="" aria-pressed="true">EN</button><button data-l="-uk">UK</button></span>
</nav>
<main id="shots"></main>
<script>
  const screens = [["start", "Start: drop, open, recent files, update downloading"], ["editor", "Editor: tooltip with its shortcut"],
    ["crop", "Crop bar in the header: presets on 1–6"], ["strip", "Strip bar in the header, cut stretches"], ["export", "Export settings"],
    ["metadata", "File info"], ["shortcuts", "Keyboard shortcuts ?"], ["confirm", "Close with unexported edits"],
    ["exporting", "Export running"], ["log", "ffmpeg log: its own window, opened from the status bar's bottom-left button"],
    ["menu", "Timeline context menu, saved toast, Update now"], ["small-editor", "Smallest window (980 × 460)"],
    ["small-crop", "Smallest window, Crop"], ["small-strip", "Smallest window, Strip"]];
  const main = document.getElementById("shots");
  for (const [s, label] of screens) main.insertAdjacentHTML("beforeend", `<figure><figcaption>${label}</figcaption><img data-s="${s}" alt="${label}"></figure>`);
  let font = "space-mono", lang = "";
  const show = () => {
    document.querySelectorAll("img").forEach(i => i.src = font === "space-mono"
      ? `renders/phosphor-${i.dataset.s}${lang}.png`
      : `renders/fonts/${font}/${i.dataset.s}${lang}.png`);
    document.querySelectorAll("#fonts button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === font));
    document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  };
  document.querySelectorAll("#fonts button").forEach(b => b.onclick = () => { font = b.dataset.f; show(); });
  document.querySelectorAll("#langs button").forEach(b => b.onclick = () => { lang = b.dataset.l; show(); });
  show();
</script>
</body></html>
