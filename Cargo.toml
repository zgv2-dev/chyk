[package]
name = "glint"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui-phosphor = "0.14"
libmpv2 = "6"
rfd = "0.17"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
flate2 = "1"

[build-dependencies]
flate2 = "1"

# build.rs deflates ~300 MB on Windows; unoptimized miniz takes minutes.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

# Moving the native traffic lights into the header (src/chrome.rs). Same versions eframe uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "NSColorSpace", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
raw-window-handle = "0.6"
