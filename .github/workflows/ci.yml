name: CI

# Every push and PR: build, test and package for macOS, Windows and Linux.
# Tags like v1.2.3: also publish the packages as a GitHub release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  macos:
    # Local equivalent: scripts/package-macos.sh. Each runner builds for its own CPU; the
    # bundled Homebrew libraries set the oldest macOS each DMG runs on (the runner's version).
    strategy:
      matrix:
        include:
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      # Signing and notarizing need the repo secrets (README "Release signing"); without them,
      # and on pull requests from forks, the app is ad-hoc signed as before.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: brew install mpv dylibbundler
      - run: cargo test
      # The Developer ID certificate goes into a throwaway keychain that codesign can use unprompted.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          base64 --decode <<<"$MACOS_CERTIFICATE" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$id" ]; then echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; fi
          echo "CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      # Notarizing takes a few minutes, so only release tags (including -rc test tags) do it.
      - name: Package
        env:
          NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' && '1' || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    # Local equivalent: scripts/package-linux.sh.
    # mpv >= 0.35 (libmpv.so.2) is needed, so 24.04 is the oldest usable Ubuntu.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev ffmpeg libxkbcommon-dev libfuse2 rpm
      - run: cargo test
      # Tests already ran above.
      - run: SKIP_TESTS=1 scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  windows:
    # Local equivalent: scripts/package-windows.ps1.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows packaging script
        run: |
          foreach ($file in @("$PWD/scripts/package-windows.ps1") + (Get-ChildItem scripts/windows/*.ps1).FullName) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv and ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*.7z' -O mpv.7z
          7z x mpv.7z -ompv | Out-Null
          # MSVC needs an import library; build mpv.lib from the DLL's exports.
          $exports = dumpbin /exports mpv/libmpv-2.dll | ForEach-Object { if ($_ -match '\s(mpv_\w+)$') { $Matches[1] } }
          Set-Content mpv/mpv.def (@('EXPORTS') + $exports)
          lib /nologo /def:mpv/mpv.def /name:libmpv-2.dll /out:mpv/mpv.lib /machine:x64
          gh release download latest -R BtbN/FFmpeg-Builds -p 'ffmpeg-master-latest-win64-gpl.zip' -O ffmpeg.zip
          7z x ffmpeg.zip | Out-Null
          "MPV_LIB_DIR=$PWD\mpv" >> $env:GITHUB_ENV
          "$PWD\mpv" >> $env:GITHUB_PATH
          "$PWD\ffmpeg-master-latest-win64-gpl\bin" >> $env:GITHUB_PATH
      - run: cargo test
      # The Windows 11 menu entry's DLL and stub exe (shell/), embedded next to libmpv and ffmpeg.
      - name: Build shell extension
        run: |
          cargo build --release -p chyk-shell
          "CHYK_SHELL_DIR=$PWD\target\release" >> $env:GITHUB_ENV
      # build.rs pins libmpv (MPV_LIB_DIR) and ffmpeg (PATH) by hash. The portable build embeds
      # them and unpacks them into Chyk\ next to itself; the installer downloads them from the
      # windows-libs release, which gets the gzipped copies written to CHYK_DEPS_OUT (src/bundle.rs).
      - name: Build installer and portable exe
        run: |
          New-Item -ItemType Directory -Force dist, libs | Out-Null
          $env:CHYK_DEPS_OUT = "$PWD\libs"
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/chyk.exe "dist/Chyk-windows-x64-setup.exe"
          Remove-Item Env:CHYK_DEPS_OUT
          cargo build --release --features portable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/chyk.exe "dist/Chyk-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
      # To try a CI installer before release: unzip this and run it with CHYK_LIBS_URL=file:///<folder>.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-libs
          path: libs/*.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: '{macos-*,linux,windows}'
      - uses: actions/download-artifact@v4
        with:
          name: windows-libs
          path: libs
      # One prerelease holds every pinned library, named by hash, so any installer keeps finding
      # its own. Prerelease keeps it out of releases/latest (the updater and the site's links).
      - name: Publish Windows libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-libs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create windows-libs --repo "$GITHUB_REPOSITORY" --prerelease --title "Windows libraries" \
              --notes "libmpv and ffmpeg for the Windows installer, which downloads and checks them. Not a release." ||
            gh release view windows-libs --repo "$GITHUB_REPOSITORY" >/dev/null
          have=$(gh release view windows-libs --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in libs/*.gz; do
            grep -qxF "$(basename "$f")" <<<"$have" || gh release upload windows-libs "$f" --repo "$GITHUB_REPOSITORY"
          done
      # The notes are this version's CHANGELOG.md section, followed by GitHub's compare link.
      # A tag with a suffix (v1.4.0-rc.1) is a test build: a prerelease, which stays out of
      # releases/latest (the updater and the site), with the Unreleased section as its notes.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            pre=(--prerelease --latest=false)
            scripts/release-notes.sh Unreleased > notes.md
            [ -s notes.md ] || echo "Test build." > notes.md
          else
            scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          fi
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes "${pre[@]}"
      # AUR chyk-bin: packaging/arch/PKGBUILD with this version and the .deb's checksum. Skipped for
      # test builds and until the AUR_SSH_PRIVATE_KEY secret exists (README "Release signing").
      - name: Prepare AUR package
        id: aur
        if: env.HAS_AUR_KEY == 'true' && !contains(github.ref_name, '-')
        run: |
          sum=$(sha256sum dist/Chyk-linux-amd64.deb | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/arch/PKGBUILD > PKGBUILD
          cat PKGBUILD
      - name: Publish to the AUR
        if: steps.aur.outcome == 'success'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: chyk-bin
          pkgbuild: PKGBUILD
          commit_username: zgv2
          commit_email: dev@bogdanbpeterson.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
