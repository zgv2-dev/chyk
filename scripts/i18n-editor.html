<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glint · Translations</title>
<link rel="stylesheet" href="/assets/phosphor.css">
<style>
@font-face { font-family: SpaceMono; src: url(/assets/SpaceMono-Regular.ttf); }
@font-face { font-family: SpaceMono; src: url(/assets/SpaceMono-Bold.ttf); font-weight: 700; }
:root { --g: #4dff9b; --g2: #1f8f55; --r: #ff5c78; --amber: #ffc857; --panel: #030805; --card: #07130c; --line: #12301f; --text: #cfeedd; --mute: #5f8a71; --ink: #00140a; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: #000; color: var(--text); font: 12.5px/1.45 SpaceMono, ui-monospace, monospace; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--g); outline-offset: 1px; }

header { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { width: 30px; height: 22px; }
.wordmark { color: var(--g); font-weight: 700; letter-spacing: .2em; }
.search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-left: 18px; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; }
.search i { color: var(--mute); } .search input { flex: 1; background: none; border: 0; outline: none; }
.seg { display: flex; padding: 2px; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.seg button { height: 28px; padding: 0 12px; border-radius: 6px; color: var(--mute); }
.seg button.on { color: var(--g); background: rgba(77,255,155,.11); box-shadow: inset 0 0 0 1px rgba(77,255,155,.5); }
.count { color: var(--mute); } .count b { color: var(--amber); font-weight: 400; }
.grow { flex: 1; }
.state { color: var(--mute); }
.state.dirty { color: var(--amber); }
.primary { height: 34px; padding: 0 16px; border-radius: 8px; background: var(--g); color: var(--ink); font-weight: 700; box-shadow: 0 0 18px rgba(77,255,155,.3); }
.primary:disabled { opacity: .35; box-shadow: none; cursor: default; }

main { display: grid; grid-template-columns: minmax(560px, 1fr) minmax(420px, 46%); min-height: 0; }
.table { overflow-y: auto; border-right: 1px solid var(--line); }
.cols, .row { display: grid; grid-template-columns: 210px 1fr 1fr; gap: 10px; padding: 0 16px; }
.cols { position: sticky; top: 0; z-index: 2; padding-top: 10px; padding-bottom: 8px; background: rgba(0,0,0,.92); color: var(--mute); border-bottom: 1px solid var(--line); }
.section { padding: 18px 16px 6px; color: var(--g); font-weight: 700; }
.row { padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(18,48,31,.5); align-items: start; }
.row.flash { animation: flash 1.2s; }
@keyframes flash { from { background: rgba(77,255,155,.18); } to { background: transparent; } }
.row:hover { background: rgba(77,255,155,.03); }
.key { color: var(--mute); font-size: 11px; word-break: break-all; padding-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tags button { font-size: 10px; padding: 1px 6px; border-radius: 4px; color: var(--g2); border: 1px solid var(--line); }
.tags button:hover { color: var(--g); border-color: var(--g2); }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; }
.badge.missing { color: var(--r); border: 1px solid rgba(255,92,120,.5); }
.badge.same, .badge.ph { color: var(--amber); border: 1px solid rgba(255,200,87,.45); }
textarea { width: 100%; resize: none; overflow: hidden; min-height: 30px; padding: 5px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; outline: none; }
textarea:focus { border-color: var(--g2); }
textarea.changed { border-color: rgba(255,200,87,.6); }
textarea:disabled { background: none; border-style: dashed; color: var(--mute); }
.empty { padding: 40px 16px; color: var(--mute); }

.preview { display: flex; flex-direction: column; min-height: 0; background: radial-gradient(circle at 50% 40%, #04110a, #000 70%); }
.ptools { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ptools .seg button i { font-size: 15px; }
.frame { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.frame iframe { position: absolute; left: 16px; top: 16px; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6); background: #000; }
.hint { padding: 0 16px 12px; color: var(--mute); font-size: 11px; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 24"><rect x="1" y="4" width="30" height="16" rx="4" fill="#4dff9b" stroke="none"/><rect x="6.5" y="6.5" width="19" height="11" rx="1" fill="#07130c" stroke="none"/><path d="M12.8 8v8M19.2 8v8" stroke="#4dff9b" stroke-opacity=".3" stroke-width="1"/><path d="M3.5 9v6M28.5 9v6" stroke="#00140a" stroke-width="1"/><path d="M14.1 1v22" stroke="#fff" stroke-width="1.5"/></svg>
  <span class="wordmark">G L I N T</span>
  <label class="search"><i class="ph ph-magnifying-glass"></i><input id="q" placeholder="Search keys and text" autocomplete="off"></label>
  <div class="seg" id="filter">
    <button data-f="all" class="on">All</button>
    <button data-f="issues">Needs attention</button>
  </div>
  <span class="count" id="count"></span>
  <div class="grow"></div>
  <span class="state" id="state">Saved</span>
  <button class="primary" id="save" disabled><i class="ph ph-floppy-disk"></i>Save</button>
</header>
<main>
  <section class="table" id="table">
    <div class="cols"><span>Key</span><span>English</span><span>Українська</span></div>
    <div id="rows"></div>
  </section>
  <section class="preview">
    <div class="ptools">
      <div class="seg" id="screens">
        <button data-s="start" class="on"><i class="ph ph-film-slate"></i>Start</button>
        <button data-s="editor"><i class="ph ph-crop"></i>Crop</button>
        <button data-s="strip"><i class="ph ph-magic-wand"></i>Strip</button>
        <button data-s="metadata"><i class="ph ph-info"></i>Info</button>
        <button data-s="export"><i class="ph ph-export"></i>Export</button>
      </div>
      <div class="seg" id="langs">
        <button data-l="en">EN</button>
        <button data-l="uk" class="on">UK</button>
      </div>
    </div>
    <div class="frame" id="frame"><iframe id="iframe" title="Preview"></iframe></div>
    <p class="hint">Click text in the preview to jump to its row. Strings are compiled into Glint, so rebuild the app after saving.</p>
  </section>
</main>
<script>
const LANGS = ["en", "uk"];
const FORMS = ["one", "few", "many", "other"];
const SCREENS = ["start", "editor", "strip", "metadata", "export"];
const SCREEN_NAMES = { start: "Start", editor: "Crop", strip: "Strip", metadata: "Info", export: "Export" };
// Sample values for placeholders in the preview.
const SAMPLE = { key: "⌘W", n: 2, time: "0:05.720", pct: "62", size: "48.2 MB", speed: "2x", view: "1.0x · 0:00.000 – 0:42.000", path: "rooftop_take3.mov", error: "…" };

const state = { saved: { en: {}, uk: {} }, cur: { en: {}, uk: {} }, rows: [], screen: "start", lang: "uk", filter: "all", query: "", onScreen: {} };
const $ = (s, el = document) => el.querySelector(s);

function parse(text) {
  const values = {}, order = [], sections = {};
  let lastComment = null, blankBefore = true;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { blankBefore = true; lastComment = null; continue; }
    if (line.startsWith("#")) { lastComment = blankBefore ? line.replace(/^#\s*/, "") : null; blankBefore = false; continue; }
    const i = line.indexOf("=");
    if (i < 0) continue;
    const key = line.slice(0, i).trim();
    if (lastComment) { sections[key] = lastComment; lastComment = null; }
    values[key] = line.slice(i + 1).trim();
    order.push(key);
    blankBefore = false;
  }
  return { values, order, sections };
}

const baseOf = k => { const m = k.match(/^(.*)\.(one|few|many|other)$/); return m ? m[1] : k; };
const isPlural = k => baseOf(k) !== k;
const holders = v => new Set([...(v || "").matchAll(/\{(\w+)\}/g)].map(m => m[1]));
const fill = v => v.replace(/\{(\w+)\}/g, (m, n) => n in SAMPLE ? SAMPLE[n] : m);

function buildRows(en, uk) {
  const rows = [], done = new Set();
  const add = (key, section) => { if (!done.has(key)) { done.add(key); rows.push({ key, section }); } };
  for (const key of en.order) {
    const section = en.sections[key];
    if (isPlural(key)) {
      const base = baseOf(key);
      FORMS.map(f => `${base}.${f}`).filter(k => k in en.values || k in uk.values).forEach((k, i) => add(k, i === 0 ? section : undefined));
    } else add(key, section);
  }
  uk.order.filter(k => !done.has(k)).forEach((k, i) => add(k, i === 0 ? "Only in Ukrainian" : undefined));
  return rows;
}

function issues(key) {
  const en = state.cur.en[key], uk = state.cur.uk[key];
  const out = [];
  if (!uk) out.push(["missing", "Missing"]);
  else if (en && uk === en && /[a-z]{3}/i.test(en) && !/^ffmpeg/.test(en)) out.push(["same", "Same as English"]);
  // Placeholders must match per base key, across plural forms.
  const base = baseOf(key);
  const union = lang => { const s = new Set(); for (const k in state.cur[lang]) if (baseOf(k) === base) holders(state.cur[lang][k]).forEach(h => h !== "n" && s.add(h)); return [...s].sort().join(); };
  if (uk && union("en") !== union("uk")) out.push(["ph", "Placeholders differ"]);
  return out;
}

function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }

function render() {
  const box = $("#rows");
  box.textContent = "";
  const q = state.query.toLowerCase();
  let shown = 0, flagged = 0;
  for (const { key, section } of state.rows) {
    const probs = issues(key);
    if (probs.length) flagged++;
    const text = `${key} ${state.cur.en[key] || ""} ${state.cur.uk[key] || ""}`.toLowerCase();
    if (q && !text.includes(q)) continue;
    if (state.filter === "issues" && !probs.length) continue;
    if (section && !q && state.filter === "all") {
      const h = document.createElement("div");
      h.className = "section"; h.textContent = section;
      box.append(h);
    }
    const row = document.createElement("div");
    row.className = "row"; row.dataset.key = key;
    const k = document.createElement("div");
    k.className = "key"; k.textContent = key;
    const tags = document.createElement("div");
    tags.className = "tags";
    for (const [cls, label] of probs) {
      const b = document.createElement("span");
      b.className = `badge ${cls}`; b.textContent = label;
      tags.append(b);
    }
    for (const s of SCREENS) if (state.onScreen[s]?.has(key)) {
      const b = document.createElement("button");
      b.innerHTML = `<i class="ph ph-eye"></i>${SCREEN_NAMES[s]}`;
      b.onclick = () => { showScreen(s); highlight(key); };
      tags.append(b);
    }
    k.append(tags);
    row.append(k);
    for (const lang of LANGS) {
      const t = document.createElement("textarea");
      t.rows = 1; t.dataset.lang = lang; t.spellcheck = true; t.lang = lang;
      const has = key in state.cur[lang] || lang === "uk" || !isPlural(key);
      t.disabled = !has;
      t.value = state.cur[lang][key] ?? "";
      if (!has) t.placeholder = "— (Ukrainian-only form)";
      t.classList.toggle("changed", (state.cur[lang][key] ?? "") !== (state.saved[lang][key] ?? ""));
      t.oninput = () => {
        state.cur[lang][key] = t.value.replace(/\s*\n\s*/g, " ");
        t.classList.toggle("changed", state.cur[lang][key] !== (state.saved[lang][key] ?? ""));
        autosize(t); markDirty(); applyPreview(); refreshTags(row, key);
      };
      t.onfocus = () => { if (lang !== state.lang) setLang(lang); highlight(key); };
      t.onblur = () => highlight(null);
      row.append(t);
    }
    row.onmouseenter = () => highlight(key);
    row.onmouseleave = () => highlight(null);
    box.append(row);
    shown++;
  }
  if (!shown) { const e = document.createElement("p"); e.className = "empty"; e.textContent = "Nothing matches."; box.append(e); }
  box.querySelectorAll("textarea").forEach(autosize);
  $("#count").innerHTML = flagged ? `<b>${flagged}</b> need attention` : "All translated";
}

function refreshTags(row, key) {
  row.querySelectorAll(".badge").forEach(b => b.remove());
  const tags = row.querySelector(".tags");
  for (const [cls, label] of issues(key).reverse()) {
    const b = document.createElement("span");
    b.className = `badge ${cls}`; b.textContent = label;
    tags.prepend(b);
  }
  let flagged = state.rows.filter(r => issues(r.key).length).length;
  $("#count").innerHTML = flagged ? `<b>${flagged}</b> need attention` : "All translated";
}

function dirty() {
  return LANGS.some(l => { const a = state.cur[l], b = state.saved[l]; return Object.keys({ ...a, ...b }).some(k => (a[k] ?? "") !== (b[k] ?? "")); });
}
function markDirty() {
  const d = dirty();
  $("#save").disabled = !d;
  $("#state").textContent = d ? "Unsaved changes" : "Saved";
  $("#state").classList.toggle("dirty", d);
}

async function save() {
  if (!dirty()) return;
  const body = {};
  for (const l of LANGS) body[l] = state.cur[l];
  const res = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { $("#state").textContent = "Save failed: " + ((await res.json()).error || res.status); return; }
  state.saved = JSON.parse(JSON.stringify(state.cur));
  markDirty();
  document.querySelectorAll("textarea.changed").forEach(t => t.classList.remove("changed"));
}

// ---- preview
const iframe = $("#iframe");
function fitFrame() {
  const box = $("#frame");
  const scale = Math.min((box.clientWidth - 32) / 1280, (box.clientHeight - 32) / 800);
  iframe.style.transform = `scale(${scale})`;
}
function value(key) { return state.cur[state.lang][key] || state.cur.en[key] || key; }
function applyPreview() {
  const doc = iframe.contentDocument;
  if (!doc) return;
  doc.documentElement.lang = state.lang;
  doc.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = fill(value(el.dataset.i18n)); });
  doc.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = fill(value(el.dataset.i18nTitle)); });
}
function highlight(key) {
  const doc = iframe.contentDocument;
  if (!doc) return;
  doc.querySelectorAll("[data-i18n],[data-i18n-title]").forEach(el => {
    const hit = key && (el.dataset.i18n === key || el.dataset.i18nTitle === key);
    el.style.outline = hit ? "2px solid #ffc857" : "";
    el.style.outlineOffset = hit ? "2px" : "";
  });
}
function showScreen(s) {
  if (state.screen === s && iframe.src) return;
  state.screen = s;
  document.querySelectorAll("#screens button").forEach(b => b.classList.toggle("on", b.dataset.s === s));
  iframe.src = `/phosphor-${s}.html`;
}
function setLang(l) {
  state.lang = l;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  applyPreview();
}
iframe.onload = () => {
  applyPreview();
  const doc = iframe.contentDocument;
  doc.addEventListener("click", e => {
    const el = e.target.closest("[data-i18n],[data-i18n-title]");
    if (!el) return;
    e.preventDefault();
    const key = el.dataset.i18n || el.dataset.i18nTitle;
    let row = document.querySelector(`.row[data-key="${CSS.escape(key)}"]`);
    if (!row) { state.query = ""; $("#q").value = ""; state.filter = "all"; syncFilter(); render(); row = document.querySelector(`.row[data-key="${CSS.escape(key)}"]`); }
    row.scrollIntoView({ block: "center", behavior: "smooth" });
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
    row.querySelector(`textarea[data-lang="${state.lang}"]`)?.focus();
  });
  doc.querySelectorAll("[data-i18n],[data-i18n-title]").forEach(el => el.style.cursor = "pointer");
};

function syncFilter() { document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("on", b.dataset.f === state.filter)); }

async function init() {
  const files = await (await fetch("/api/strings")).json();
  const en = parse(files.en), uk = parse(files.uk);
  state.saved = { en: { ...en.values }, uk: { ...uk.values } };
  state.cur = { en: { ...en.values }, uk: { ...uk.values } };
  state.rows = buildRows(en, uk);
  // Which keys each mockup screen shows, for the row tags.
  await Promise.all(SCREENS.map(async s => {
    const html = await (await fetch(`/phosphor-${s}.html`)).text();
    state.onScreen[s] = new Set([...html.matchAll(/data-i18n(?:-title)?="([^"]+)"/g)].map(m => m[1]));
  }));
  render();
  showScreen("start");
  fitFrame();
}

$("#q").oninput = e => { state.query = e.target.value; render(); };
document.querySelectorAll("#filter button").forEach(b => b.onclick = () => { state.filter = b.dataset.f; syncFilter(); render(); });
document.querySelectorAll("#screens button").forEach(b => b.onclick = () => showScreen(b.dataset.s));
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));
$("#save").onclick = save;
addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
addEventListener("beforeunload", e => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
addEventListener("resize", fitFrame);
init();
</script>
</body>
</html>
