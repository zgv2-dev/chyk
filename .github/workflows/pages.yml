# Publish site/ (the landing page at chyk.zgv2.dev) to GitHub Pages whenever it changes on main.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Type-check and bundle site/ts into site/js, then drop the sources from the upload.
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run build
          rm -r node_modules ts package.json package-lock.json tsconfig.json .gitignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
